name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only fetch the ~230 MB LFS checkpoint on pushes to main; free GitHub
  # accounts get 1 GB of LFS bandwidth per month.
  FULL_RUN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check --select F821,E9 .

      - name: Smoke tests (without the real checkpoint)
        if: env.FULL_RUN != 'true'
        run: pytest -q smoke_test.py -m "not model"

      - name: Smoke tests (including the real checkpoint)
        if: env.FULL_RUN == 'true'
        env:
          REQUIRE_MODEL: "1"
        run: pytest -q smoke_test.py

  docker:
    runs-on: ubuntu-latest
    steps:
      # No LFS here: the image is only built and started, the model is not run
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t colorize-ai:ci .

      - name: Start container and check health
        run: |
          docker run -d --name colorize-ci -p 8501:8501 colorize-ai:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8501/_stcore/health
          curl -fsS -o /dev/null http://localhost:8501/

      - name: Container logs
        if: always()
        run: docker logs colorize-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f colorize-ci || true
