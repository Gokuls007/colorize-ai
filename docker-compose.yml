version: '3.8'

services:
  colorizer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory for input/output images
      - ./data:/app/data
      # Mount results directory
      - ./results:/app/results
      # Mount model checkpoints
      - ./checkpoints:/app/checkpoints
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped

    # GPU support (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: CLI-only service for batch processing
  colorizer-cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    entrypoint: ["python", "main.py"]
    command: ["--help"]
    profiles:
      - cli
